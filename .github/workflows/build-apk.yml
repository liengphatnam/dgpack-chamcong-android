name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Mặc định action chạy `sdkmanager tools`, nhưng gói 'tools' đã bị Google gỡ
          # khỏi kho SDK (09/2026) nên bước này fail. Chỉ cài platform-tools, các
          # thành phần còn lại (platforms, build-tools) Gradle/AGP tự tải khi build.
          packages: platform-tools

      - name: Generate app/debug.keystore if missing
        # signingConfigs.debug trong app/build.gradle.kts trỏ cố định vào file này (thay
        # vì để AGP tự dùng keystore ẩn của máy build) — file này đã được commit thẳng
        # vào repo nên bước này thường chỉ là no-op, chỉ thực sự sinh mới nếu ai đó lỡ
        # xoá file. Không dùng actions/cache nữa vì lần trước cache trỏ sai đường dẫn
        # (~/.android/debug.keystore không tồn tại trên runner) khiến cache không lưu
        # được gì, mỗi build vẫn bị ký bằng key khác nhau.
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "GENERATED=1" >> "$GITHUB_ENV"
          fi

      - name: Commit debug.keystore vừa sinh (chỉ chạy 1 lần duy nhất)
        # [skip ci] để tránh push này tự kích hoạt lại chính workflow (vòng lặp vô hạn).
        if: env.GENERATED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/debug.keystore
          git commit -m "chore: thêm debug.keystore cố định để mọi build CI ký giống nhau [skip ci]"
          git push

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug -PciBuildNumber=${{ github.run_number }} --stacktrace

      - name: Verify APK integrity (kích thước, chữ ký, zipalign)
        # Kiểm tra ngay trong CI thay vì để user tải về mới phát hiện file lỗi —
        # "App not installed" trên Android thường do APK hỏng/misaligned mà không rõ lý do.
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "Kích thước: $(stat -c%s "$APK") bytes"
          echo "SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "Dùng build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" || (echo "::error::APK không align đúng — sẽ bị Android từ chối cài đặt" && exit 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK" || (echo "::error::Chữ ký APK không hợp lệ" && exit 1)

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
